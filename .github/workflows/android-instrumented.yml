name: Android Instrumented Tests and Scale Benchmark

# Runs automatically on every push / pull request (together with android-build.yml) and can still be
# started by hand from the Actions tab. An emulator run is slow (roughly 15-40 min), so a newer push to the
# same branch cancels the older run that is still going.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_rows:
        description: "Number of questions to import in the benchmark (300000 = real target)"
        required: false
        default: "20000"
      api_level:
        description: "Emulator API level"
        required: false
        default: "34"

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Room runtime tests and benchmark on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          add-job-summary: "never"

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BENCHMARK_ROWS: ${{ inputs.benchmark_rows || '20000' }}
        with:
          api-level: ${{ inputs.api_level || 34 }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/run-instrumented.sh

      - name: Upload instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBank-instrumented-report
          path: |
            build-report/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
