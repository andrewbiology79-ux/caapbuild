name: Android Instrumented Tests and Scale Benchmark

# Manual only: an emulator run is slow. Start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the slow scale benchmark (off = fast functional tests only)"
        type: boolean
        required: false
        default: false
      benchmark_rows:
        description: "Questions to import when run_benchmark is on (300000 = real target)"
        required: false
        default: "20000"
      api_level:
        description: "Emulator API level"
        required: false
        default: "34"

permissions:
  contents: read

jobs:
  instrumented:
    name: Room runtime tests and benchmark on emulator
    runs-on: ubuntu-latest
    # Functional tests normally finish in a few minutes; only the benchmark may need the long limit.
    timeout-minutes: ${{ inputs.run_benchmark && 120 || 25 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          add-job-summary: "never"

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BENCHMARK_ROWS: ${{ inputs.benchmark_rows }}
          RUN_BENCHMARK: ${{ inputs.run_benchmark }}
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/run-instrumented.sh

      - name: Upload instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBank-instrumented-report
          path: |
            build-report/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
