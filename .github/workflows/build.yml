name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run typecheck

  build-apk:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      # Builds on the GitHub runner itself, so the APK is a downloadable artifact.
      - name: Build APK
        run: eas build --platform android --profile preview --local --non-interactive --output ./physics-cq.apk

      - uses: actions/upload-artifact@v4
        with:
          name: physics-cq-apk
          path: physics-cq.apk
