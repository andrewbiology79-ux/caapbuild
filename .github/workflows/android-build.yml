name: Android Test and APK Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Room and SQLite tests, then APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"
          add-job-summary: "never"

      # One-time helper: if the repository has no Gradle wrapper yet, generate it and
      # upload it as an artifact so it can be downloaded and committed (gradlew,
      # gradlew.bat, gradle/wrapper/*). Skipped automatically once the wrapper is committed.
      - name: Generate Gradle wrapper (only when missing)
        id: wrapper
        if: hashFiles('gradlew') == ''
        continue-on-error: true
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.14.4 --distribution-type bin --no-daemon
          ls -la gradlew gradlew.bat gradle/wrapper

      - name: Upload generated Gradle wrapper
        if: steps.wrapper.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBank-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          retention-days: 30

      # Keep the complete Gradle output even when KAPT, tests, or APK assembly fails.
      - name: Run tests and build debug APK (capture full log)
        id: build
        shell: bash
        run: |
          mkdir -p build-report
          set +e
          if [ -f gradlew ]; then GRADLE_CMD="sh ./gradlew"; else GRADLE_CMD="gradle"; fi
          echo "Using: $GRADLE_CMD" | tee build-report/gradle-build.log
          $GRADLE_CMD --no-daemon --no-build-cache testDebugUnitTest assembleDebug --stacktrace --info 2>&1 | tee -a build-report/gradle-build.log
          build_exit_code=${PIPESTATUS[0]}
          echo "exit_code=${build_exit_code}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$build_exit_code" > build-report/gradle-exit-code.txt
          exit "$build_exit_code"

      # v0.2.15: compile the androidTest sources (no emulator) so compile errors show up in the normal CI.
      # Blocking gate: Compose UI changes must not pass CI unless androidTest sources still compile.
      - name: Compile androidTest sources
        if: always()
        shell: bash
        run: |
          mkdir -p build-report
          if [ -f gradlew ]; then GRADLE_CMD="sh ./gradlew"; else GRADLE_CMD="gradle"; fi
          $GRADLE_CMD --no-daemon compileDebugAndroidTestKotlin --stacktrace 2>&1 | tee build-report/androidtest-compile.log
          exit ${PIPESTATUS[0]}

      # v0.2.20: assemble the unsigned release variant as a blocking build gate.
      # Read build-report/release-assemble.log. The APK is not uploaded: it is unsigned and not installable.
      - name: Assemble release variant
        if: always()
        shell: bash
        run: |
          mkdir -p build-report
          if [ -f gradlew ]; then GRADLE_CMD="sh ./gradlew"; else GRADLE_CMD="gradle"; fi
          $GRADLE_CMD --no-daemon assembleRelease --stacktrace 2>&1 | tee build-report/release-assemble.log
          exit ${PIPESTATUS[0]}

      # This runs after both success and failure and creates a human-readable report.
      - name: Generate CI diagnostic report
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          mkdir -p build-report
          {
            echo "# Question Bank — GitHub Actions Build Report"
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch/ref: $GITHUB_REF"
            echo "- Runner: $RUNNER_OS"
            echo "- Java: $(java -version 2>&1 | head -n 1)"
            echo "- Build step outcome: ${BUILD_OUTCOME:-not-run}"
            echo "- Gradle exit code: ${BUILD_EXIT_CODE:-not-recorded}"
            echo
            echo "## Diagnostic files"
            echo "- gradle-build.log: complete Gradle output, including stack traces and processor diagnostics"
            echo "- gradle-exit-code.txt: Gradle process exit code, when the build command started"
            echo "- app/build/reports/: Gradle and test reports, when generated"
            echo "- app/build/test-results/: JUnit XML test results, when generated"
            echo
            echo "Download the QuestionBank-ci-report artifact from this workflow run's Artifacts section."
          } > build-report/CI_REPORT.md

      # Always upload diagnostics so a failed build still provides a downloadable report.
      - name: Upload CI diagnostic report and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBank-ci-report
          path: |
            build-report/**
            app/build/reports/**
            app/build/test-results/**
            app/schemas/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
